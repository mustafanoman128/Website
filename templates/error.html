{% extends 'base.html' %}
{% block title %}{{ title }} — Mustafa Noman{% endblock %}

{% block content %}

<section class="page-hero page-hero--error section--dark" aria-labelledby="error-title">
  <div class="container">
    <span class="section-label mono">Error {{ code }}</span>
    <h1 class="page-hero__title" id="error-title">{{ title }}</h1>
    <p class="page-hero__sub">{{ message }}</p>
    <div class="page-hero__actions">
      <a href="{{ url_for('home') }}" class="btn btn--primary">Back to home</a>
      <a href="{{ url_for('contact') }}" class="btn btn--ghost">Contact me</a>
    </div>
  </div>
</section>

{% endblock %}
