{% extends 'base.html' %}
{% block title %}{{ post.title }} — Mustafa Noman{% endblock %}

{% block content %}


<section class="post-hero section--dark" aria-labelledby="post-title">
  <div class="container">
    <a href="{{ url_for('blog') }}" class="link-arrow back-link">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="vertical-align: middle; margin-right: 4px;">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back to Blog
    </a>
    <div class="post-hero__meta">
      <span class="mono blog-card__date">{{ post.created_at.strftime('%B %d, %Y') }}</span>
      <span class="mono">&middot; by {{ post.author.name }}</span>
      <span class="post-reading-time mono" id="reading-time"></span>
    </div>
    <h1 class="post-hero__title" id="post-title">{{ post.title }}</h1>
  </div>
</section>

<section class="section" aria-label="Blog post content">
  <div class="container container--narrow">

    {% if post.images %}
    <div class="post-image-bundle reveal">
      <div class="image-stack image-stack--large">
        <div class="image-stack__item stack-1">
          <img src="{{ url_for('static', filename='uploads/blog_images/' + post.images[0].image_path) }}" alt="{{ post.title }}" loading="lazy" />
        </div>
      </div>
    </div>
    {% endif %}

    <div class="post-content reveal">
      {{ post.content | nl2br | safe }}
    </div>


  </div>
</section>


{% endblock %}
